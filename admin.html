<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel · Shammah Moving</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<style>
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-display:swap;src:url(/assets/fonts/barlow-condensed-latin-900-italic.woff2) format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/geist-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/geist-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/geist-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/geist-mono-latin-500-normal.woff2) format("woff2")}
:root{--bg:#f5f5f3;--card:#fff;--surface:#f3f3f1;--ink:#121214;--mute:#66666d;--line:#e3e3df;--orange:#ff6b1a;--orange-hi:#ff8540;--orange-soft:#fff0e6;--ok:#1d8a4b;--ok-soft:#e6f5ec;--bad:#c53b12;--bad-soft:#fff1ec;--night:#0d0d0f;
--sans:Geist,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.lbl{margin:0;font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--ink);color:#fff;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:transform .2s var(--ease),background-color .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn:hover{background:#2a2a2e}
.btn-o{background:var(--orange);color:var(--ink)}.btn-o:hover{background:var(--orange-hi)}
.btn-line{background:#fff;color:var(--ink);border-color:var(--line)}.btn-line:hover{background:#fff;border-color:var(--ink)}
.btn-bad{background:var(--bad)}.btn-bad:hover{background:#a8310e}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:progress}
.btn svg{width:17px;height:17px;flex:none}
.input,.sel,.ta{width:100%;min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:border-color .2s,background-color .2s,box-shadow .2s}
.ta{padding:12px 14px;min-height:84px;resize:vertical;line-height:1.45}
.input:hover,.sel:hover,.ta:hover{border-color:#cfcfca}
.input:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px rgba(255,107,26,.18)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:#3d3d42}
.fld small{color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;min-height:36px;padding:0 14px;font-weight:600;font-size:13px;color:#55555b}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chk{display:flex;align-items:center;gap:10px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--orange)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--surface);color:#44444a;white-space:nowrap}
.tag.pending{background:var(--orange-soft);color:#a8470a}
.tag.confirmed{background:var(--ok-soft);color:var(--ok)}
.tag.done{background:#e8e8ea;color:#44444a}
.tag.cancelled{background:var(--bad-soft);color:var(--bad)}
.tag.src{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}

/* login */
.login{min-height:100svh;display:grid;place-items:center;padding:24px}
.lcard{width:min(440px,100%);background:#fff;border-radius:28px;padding:clamp(24px,5vw,36px);box-shadow:0 30px 60px -30px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:38px;height:38px;border-radius:50%}
.brand b{font-family:var(--disp);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.03em;line-height:1}
.lcard h1{margin:22px 0 6px;font-weight:500;font-size:34px;line-height:1;letter-spacing:-.04em}
.lcard p.sub{margin:0 0 20px;color:var(--mute)}
.lcard form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.lerr{margin:0;padding:11px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:500;font-size:14px}
.lcard .back{display:inline-block;margin-top:18px;color:var(--mute);font-size:14px}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100svh}
.side{position:sticky;top:0;height:100svh;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side .brand{padding:4px 8px 16px}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:14px;background:none;color:#3c3c41;font-weight:500;text-align:left;transition:background-color .2s,color .2s}
.ni svg{width:19px;height:19px;flex:none}
.ni:hover{background:var(--surface)}
.ni[aria-current="page"]{background:var(--ink);color:#fff}
.ni .cnt{margin-left:auto;min-width:22px;padding:2px 7px;border-radius:999px;background:var(--orange);color:var(--ink);font:600 12px var(--mono);text-align:center}
.side .sp{flex:1}
.side .who{padding:10px 14px;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.main{padding:clamp(16px,3vw,36px);min-width:0;max-width:1240px;width:100%}
.mbar{display:none}
.scrim{display:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{margin:6px 0 0;font-weight:500;font-size:clamp(30px,3.6vw,46px);line-height:1;letter-spacing:-.04em}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:22px;padding:clamp(16px,2.2vw,24px)}
.stack{display:flex;flex-direction:column;gap:14px}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.skel{background:linear-gradient(90deg,#f0f0ee,#e6e6e3,#f0f0ee);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:60;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .35s var(--ease);box-shadow:0 0 50px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;z-index:55;background:rgba(13,13,15,.45)}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:30;padding:10px 14px;background:rgba(245,245,243,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .mbar .brand img{width:32px;height:32px}.mbar .brand b{font-size:20px}
  .burger{width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center}
}

/* agenda */
.ag{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1060px){.ag{grid-template-columns:minmax(0,1fr)}}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cal-h b{font-weight:600;font-size:20px;letter-spacing:-.02em}
.cal-h .nav{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.ib:hover{border-color:var(--ink)}
.ib svg{width:18px;height:18px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{padding:4px 0 8px;text-align:center;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.dc{position:relative;display:flex;flex-direction:column;gap:6px;min-height:88px;padding:8px;border-radius:14px;border:1px solid transparent;background:var(--surface);text-align:left;min-width:0;transition:border-color .2s,background-color .2s}
.dc:hover{border-color:var(--ink)}
.dc .n{font-weight:600;font-size:15px}
.dc.out{opacity:.45}
.dc.closed{background:none;color:#a3a3a8}
.dc.today .n{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:var(--orange);color:var(--ink)}
.dc.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.dc .c{margin-top:auto;font:500 11px var(--mono);letter-spacing:.04em;color:var(--mute);display:flex;align-items:center;gap:6px}
.dc.sel .c{color:#c9c9ce}
.dc .c i{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.bars{display:grid;gap:3px}
.bars i{display:block;height:5px;border-radius:3px;background:#dcdcd7;position:relative;overflow:hidden}
.bars i::after{content:"";position:absolute;inset:0;width:var(--w,0%);background:var(--orange);border-radius:3px}
.bars i.full::after{background:var(--ink)}
.dc.sel .bars i{background:#3a3a3f}.dc.sel .bars i.full::after{background:#fff}
@media (max-width:560px){.dc{min-height:60px;padding:6px}.dc .c span{display:none}.mg{gap:3px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.day-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.day-h h2{margin:4px 0 0;font-weight:500;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.cap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cap .tag{background:var(--surface)}

/* booking cards + rows */
.bk{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--surface);text-align:left;width:100%;border:1px solid transparent;transition:border-color .2s}
.bk:hover{border-color:var(--ink)}
.bk .t{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bk b{font-weight:600;font-size:16px}
.bk .m{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.bk .r{display:flex;gap:6px;flex-wrap:wrap}
.tbl{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(0,1.5fr) minmax(0,1.6fr) auto;gap:6px 16px;align-items:center;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
.tr:hover{border-color:var(--ink)}
.tr .d b{display:block;font-weight:600}
.tr .d span{color:var(--mute);font-size:13px}
.tr .who b{display:block;font-weight:600}
.tr .who span,.tr .rt span{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.tr .rt{min-width:0}
.tr .ac{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:900px){.tr{grid-template-columns:minmax(0,1fr) auto}.tr .rt{grid-column:1/-1}.tr .ac{grid-column:1/-1;justify-content:flex-start}}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .input{max-width:280px;min-height:42px}
.filters .sel{max-width:180px;min-height:42px}
.cl{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.cl:hover{border-color:var(--ink)}
.cl b{font-weight:600}
.cl span{color:var(--mute);font-size:14px}
@media (max-width:760px){.cl{grid-template-columns:minmax(0,1fr) auto}}

/* drawer */
.dr-scrim{position:fixed;inset:0;z-index:70;background:rgba(13,13,15,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.dr-scrim.on{opacity:1;pointer-events:auto}
.dr{position:fixed;z-index:71;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;transform:translateX(104%);transition:transform .4s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 80px -30px rgba(0,0,0,.4)}
.dr.on{transform:none}
.dr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:4px 0 0;font-weight:500;font-size:26px;letter-spacing:-.035em;line-height:1.1}
.dr-b{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.dr-f{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff}
.dr-f .btn{flex:1 1 auto}
.sec{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.sec:first-child{padding-top:0;border-top:0}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv span{color:var(--mute)}
.kv b{font-weight:500;overflow-wrap:anywhere}
.quote{padding:16px;border-radius:18px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.money{position:relative}
.money b{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--mute);pointer-events:none}
.money .input{padding-left:58px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.wa-prev{background:#e7f8dc;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;color:#111;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.wa-prev small{display:block;margin-bottom:6px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#4c7a3a}
.btn[aria-disabled="true"]{opacity:.5}
.warn{padding:12px 14px;border-radius:14px;background:var(--orange-soft);color:#7a3406;font-size:14px;display:flex;flex-direction:column;gap:10px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .h{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14px;cursor:pointer}
.hist .h:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;z-index:90;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--bad)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:var(--orange);color:var(--ink);display:none;place-items:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.4)}
.fab svg{width:26px;height:26px}
@media (max-width:900px){.fab{display:grid}}
.tools{display:grid;gap:10px}
.rowc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface)}
.rowc b{font-weight:600}
.rowc small{display:block;color:var(--mute)}
.svc{display:grid;grid-template-columns:minmax(0,1.4fr) 150px 110px auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface)}
.svc small{display:block;color:var(--mute)}
@media (max-width:760px){.svc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.svc>div:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <div class="lcard">
    <a class="brand" href="index.html"><img src="/assets/logo-160.png" alt="" width="38" height="38"><b>SHAMMAH</b></a>
    <h1>Painel da equipe</h1>
    <p class="sub">Agenda de mudanças, pedidos e clientes.</p>
    <div class="seg" role="tablist" id="ltabs">
      <button type="button" data-t="in" aria-pressed="true">Entrar</button>
      <button type="button" data-t="up" aria-pressed="false">Primeiro acesso</button>
    </div>
    <form id="lform" novalidate>
      <label class="fld"><span>E-mail</span><input class="input" type="email" id="lEmail" autocomplete="username" required></label>
      <label class="fld"><span id="lPassLbl">Senha</span><input class="input" type="password" id="lPass" autocomplete="current-password" minlength="6" required></label>
      <label class="fld" id="lInviteW" hidden><span>Código de acesso</span><input class="input" type="text" id="lInvite" autocomplete="off" autocapitalize="characters" placeholder="SHM-XXXXXXXX"><small>Pedido a quem configurou o sistema. Serve só para criar a primeira senha.</small></label>
      <p class="lerr" id="lErr" role="alert" hidden></p>
      <button class="btn btn-o" type="submit" id="lGo">Entrar</button>
    </form>
    <a class="back" href="index.html">← Voltar ao site</a>
  </div>
</section>

<div class="app" id="app" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side" aria-label="Menu">
    <a class="brand" href="index.html"><img src="/assets/logo-160.png" alt="" width="38" height="38"><b>SHAMMAH</b></a>
    <button class="ni" data-v="agenda" type="button"></button>
    <button class="ni" data-v="pedidos" type="button"></button>
    <button class="ni" data-v="clientes" type="button"></button>
    <button class="ni" data-v="equipes" type="button"></button>
    <button class="ni" data-v="servicos" type="button"></button>
    <button class="ni" data-v="bloqueios" type="button"></button>
    <button class="ni" data-v="ajustes" type="button"></button>
    <div class="sp"></div>
    <div class="who" id="who"></div>
    <button class="ni" id="out" type="button"></button>
  </aside>
  <div>
    <div class="mbar"><a class="brand" href="index.html"><img src="/assets/logo-160.png" alt="" width="32" height="32"><b>SHAMMAH</b></a><button class="burger" id="burger" type="button" aria-label="Menu"></button></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<button class="fab" id="fab" type="button" aria-label="Nova mudança" hidden></button>

<div class="dr-scrim" id="drScrim"></div>
<aside class="dr" id="dr" aria-hidden="true" aria-labelledby="drT"><div class="dr-h"><div><p class="lbl" id="drK"></p><h2 id="drT"></h2></div><button class="ib" id="drX" type="button" aria-label="Fechar"></button></div><div class="dr-b" id="drB"></div><div class="dr-f" id="drF"></div></aside>

<script src="/assets/sb.js"></script>
<script src="/assets/demo.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = SB.esc, L = "pt";

  /* ---------- icons ---------- */
  function ic(d, w) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>"; }

        return '<div class="rowc" style="grid-template-columns:minmax(0,1fr)"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><b>' + esc(c.name) + "</b><small>" + esc(c.truck || "Sem caminhão informado") + (c.active ? "" : " · inativa") + '</small></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm btn-line" type="button" data-crew-edit="' + c.id + '">Editar</button><button class="btn btn-sm btn-line" type="button" data-crew-toggle="' + c.id + '">' + (c.active ? "Desativar" : "Ativar") + '</button></div></div>' +
          (mine.length ? '<div class="hist">' + mine.map(function (o) { return '<div class="h" style="cursor:default"><span>Indisponível ' + esc(dfull(o.date_from)) + (o.date_to !== o.date_from ? " a " + esc(dfull(o.date_to)) : "") + (o.reason ? " · " + esc(o.reason) : "") + '</span><button class="btn btn-sm btn-line" type="button" data-off-del="' + o.id + '">Remover</button></div>'; }).join("") + "</div>" : "") +
          '<form class="grid3" data-off-form="' + c.id + '" style="align-items:end"><label class="fld"><span>Indisponível de</span><input class="input" type="date" name="a" required></label><label class="fld"><span>Até</span><input class="input" type="date" name="b" required></label><label class="fld"><span>Motivo</span><input class="input" name="r" maxlength="80" placeholder="Folga, manutenção…"></label><button class="btn btn-sm btn-line" type="submit" style="grid-column:1/-1;justify-self:start">Marcar indisponível</button></form></div>';
      }).join("") : '<div class="empty">Nenhuma equipe cadastrada.</div>';
      h += '<form class="grid2" id="crewNew" style="align-items:end"><label class="fld"><span>Nova equipe</span><input class="input" name="n" maxlength="60" placeholder="Ex.: Equipe 3" required></label><label class="fld"><span>Caminhão</span><input class="input" name="t" maxlength="60" placeholder="Ex.: Caminhão 26 pés"></label><button class="btn btn-o" type="submit" style="justify-self:start">Adicionar equipe</button></form></div>';
      main(h);
    }).catch(function (e) { err(e); main('<div class="empty">Não foi possível carregar as equipes.</div>'); });
  }
  function editCrew(id) {
    var c = S.crews.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    drawer("Equipe", c.name, '<label class="fld"><span>Nome</span><input class="input" id="eN" value="' + esc(c.name) + '" maxlength="60"></label><label class="fld"><span>Caminhão</span><input class="input" id="eT" value="' + esc(c.truck) + '" maxlength="60"></label>', '<button class="btn btn-o" type="button" id="eSave">Salvar</button><button class="btn btn-line" type="button" id="eDel">Excluir equipe</button>');
    $("#eSave").addEventListener("click", function () { SB.update("crews", "id=eq." + id, { name: $("#eN").value.trim() || c.name, truck: $("#eT").value.trim() }).then(function () { SB.toast("Equipe salva."); closeDrawer(); vEquipes(); }).catch(err); });
    var armed = false;
    $("#eDel").addEventListener("click", function () {
      if (!armed) { armed = true; this.textContent = "Confirmar exclusão"; this.classList.add("btn-bad"); return; }
      SB.remove("crews", "id=eq." + id).then(function () { SB.toast("Equipe excluída."); closeDrawer(); vEquipes(); }).catch(err);
    });
  }

  /* ---------- serviços ---------- */
  function vServicos() {
    SB.select("move_types", "select=*&order=sort,id").then(function (r) {
      S.types = r; S.tmap = {}; r.forEach(function (t) { S.tmap[t.id] = t; });
      var h = ph("Catálogo", "Tipos de mudança") + '<div class="card stack"><p style="margin:0;color:var(--mute)">Defina quanto tempo cada serviço ocupa e quantas equipes ele usa. Desmarque “No site” para esconder um serviço do agendamento.</p>' +
        r.map(function (t) {
          return '<div class="svc" data-svc="' + t.id + '"><div><b>' + esc(t.label_pt) + "</b><small>" + esc(t.label_en) + '</small></div><label class="fld"><span>Duração</span><select class="sel" data-f="span"><option value="full"' + (t.span === "full" ? " selected" : "") + '>Dia inteiro</option><option value="half"' + (t.span === "half" ? " selected" : "") + '>Meio dia</option></select></label><label class="fld"><span>Equipes</span><select class="sel" data-f="crews">' + [1, 2, 3, 4].map(function (n) { return '<option value="' + n + '"' + (t.crews === n ? " selected" : "") + ">" + n + "</option>"; }).join("") + '</select></label><label class="chk"><input type="checkbox" data-f="active"' + (t.active ? " checked" : "") + "> No site</label></div>";
        }).join("") + "</div>";
      main(h);
    }).catch(function (e) { err(e); main('<div class="empty">Não foi possível carregar os serviços.</div>'); });
  }

  /* ---------- datas fechadas ---------- */
  function vBloqueios() {
    SB.select("blocked_dates", "select=*&day=gte." + SB.today() + "&order=day").then(function (r) {
      var h = ph("Calendário", "Datas fechadas") + '<div class="card stack"><p style="margin:0;color:var(--mute)">Feriados e dias sem atendimento. O site não oferece essas datas.</p><form class="grid3" id="blkNew" style="align-items:end"><label class="fld"><span>De</span><input class="input" type="date" name="a" required></label><label class="fld"><span>Até (opcional)</span><input class="input" type="date" name="b"></label><label class="fld"><span>Motivo</span><input class="input" name="r" maxlength="80" placeholder="Feriado, viagem…"></label><button class="btn btn-o" type="submit" style="grid-column:1/-1;justify-self:start">Fechar data</button></form>' +
        (r.length ? '<div class="hist">' + r.map(function (x) { return '<div class="h" style="cursor:default"><span>' + esc(dlong(x.day)) + (x.reason ? " · " + esc(x.reason) : "") + '</span><button class="btn btn-sm btn-line" type="button" data-blk-del="' + x.day + '">Reabrir</button></div>'; }).join("") + "</div>" : '<div class="empty">Nenhuma data fechada.</div>') + "</div>";
      main(h);
    }).catch(function (e) { err(e); main('<div class="empty">Não foi possível carregar as datas.</div>'); });
  }

  /* ---------- ajustes ---------- */
  function vAjustes() {
    SB.select("settings", "select=*&id=eq.1").then(function (r) {
      var s = S.set = r[0] || {};
      var h = ph("Configuração", "Ajustes") + '<form class="card stack" id="setF" novalidate>' +
        '<div class="grid2"><label class="fld"><span>Nome da empresa</span><input class="input" name="business_name" value="' + esc(s.business_name) + '" maxlength="80"></label><label class="fld"><span>WhatsApp (com código do país)</span><input class="input" name="whatsapp" inputmode="tel" value="' + esc(s.whatsapp) + '" placeholder="14074856775"><small>Usado nos botões de WhatsApp do site.</small></label></div>' +
        '<div class="grid2"><label class="fld"><span>Telefone (como aparece)</span><input class="input" name="phone" value="' + esc(s.phone) + '"></label><label class="fld"><span>E-mail de contato</span><input class="input" name="email" type="email" value="' + esc(s.email) + '"></label></div>' +
        '<div class="fld"><span>Dias de atendimento</span><div style="display:flex;gap:8px 16px;flex-wrap:wrap">' + WD.map(function (w, i) { return '<label class="chk"><input type="checkbox" name="wd" value="' + i + '"' + ((s.work_days || []).indexOf(i) > -1 ? " checked" : "") + "> " + w + "</label>"; }).join("") + "</div></div>" +
        '<div class="grid2"><label class="fld"><span>Chegada de manhã</span><input class="input" name="morning_label" value="' + esc(s.morning_label) + '" maxlength="30"></label><label class="fld"><span>Chegada à tarde</span><input class="input" name="afternoon_label" value="' + esc(s.afternoon_label) + '" maxlength="30"></label></div>' +
        '<div class="grid3"><label class="fld"><span>Agendar com até (dias)</span><input class="input" name="booking_window_days" type="number" min="7" max="365" value="' + esc(s.booking_window_days) + '"></label><label class="fld"><span>Antecedência mínima (dias)</span><input class="input" name="min_notice_days" type="number" min="0" max="60" value="' + esc(s.min_notice_days) + '"></label><label class="fld"><span>Reservas por telefone</span><input class="input" name="max_active_per_phone" type="number" min="1" max="20" value="' + esc(s.max_active_per_phone) + '"></label></div>' +
        '<label class="chk"><input type="checkbox" name="auto_confirm"' + (s.auto_confirm ? " checked" : "") + "> Confirmar automaticamente os pedidos feitos pelo site<small style=\"color:var(--mute);font-weight:400\">&nbsp;(desligado: os pedidos entram como pendentes, segurando a data)</small></label>" +
        '<p class="lerr" id="sErr" hidden></p><button class="btn btn-o" type="submit" style="align-self:flex-start">Salvar ajustes</button></form>';
      main(h);
    }).catch(function (e) { err(e); main('<div class="empty">Não foi possível carregar os ajustes.</div>'); });
  }

  /* ---------- delegated clicks ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target, x;
    if ((x = t.closest("[data-copy]"))) { try { navigator.clipboard.writeText(x.dataset.copy).then(function () { SB.toast("Link copiado."); }, function () { SB.toast(x.dataset.copy); }); } catch (e) { SB.toast(x.dataset.copy); } return; }
    if ((x = t.closest("[data-confirm]"))) { ev.stopPropagation(); setStatus(x.dataset.confirm, "confirmed").then(function () { SB.toast("Pedido confirmado."); refresh(); }).catch(err); return; }
    if ((x = t.closest("[data-act]"))) {
      var a = x.dataset.act;
      if (a === "new") newBooking(x.dataset.date || null);
      else if (a === "mprev" || a === "mnext") { var y = +S.month.slice(0, 4), m = +S.month.slice(5) + (a === "mnext" ? 1 : -1); if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.month = y + "-" + pad(m); vAgenda(); }
      else if (a === "today") { S.month = SB.today().slice(0, 7); S.sel = SB.today(); vAgenda(); }
      else if (a === "csv") csv();
      return;
    }
    if ((x = t.closest("[data-day]"))) { S.sel = x.dataset.day; if (S.sel.slice(0, 7) !== S.month) { S.month = S.sel.slice(0, 7); vAgenda(); } else { $$(".dc").forEach(function (d) { var on = d.dataset.day === S.sel; d.classList.toggle("sel", on); d.setAttribute("aria-pressed", on); }); drawDay(); } return; }
    if ((x = t.closest("[data-bk]"))) { openBooking(x.dataset.bk); return; }
    if ((x = t.closest("[data-cl]"))) { openClient(x.dataset.cl); return; }
    if ((x = t.closest("[data-newfor]"))) { var c = CL.filter(function (z) { return z.id === x.dataset.newfor; })[0]; newBooking(null, c); return; }
    if ((x = t.closest("#fSt button[data-st]"))) { S.flt.st = x.dataset.st; vPedidos(); return; }
    if ((x = t.closest("[data-crew-edit]"))) { editCrew(+x.dataset.crewEdit); return; }
    if ((x = t.closest("[data-crew-toggle]"))) { var cr = S.crews.filter(function (z) { return z.id === +x.dataset.crewToggle; })[0]; SB.update("crews", "id=eq." + cr.id, { active: !cr.active }).then(vEquipes).catch(err); return; }
    if ((x = t.closest("[data-off-del]"))) { SB.remove("crew_off", "id=eq." + x.dataset.offDel).then(vEquipes).catch(err); return; }
    if ((x = t.closest("[data-blk-del]"))) { SB.remove("blocked_dates", "day=eq." + x.dataset.blkDel).then(vBloqueios).catch(err); return; }
  });
  document.addEventListener("keydown", function (ev) {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches(".tr[data-bk]")) { ev.preventDefault(); openBooking(ev.target.dataset.bk); }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "fQ") { S.flt.q = ev.target.value; drawRows(); }
    else if (ev.target.id === "cQ") listClientes(ev.target.value);
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "fSrc") { S.flt.src = t.value; vPedidos(); return; }
    var row = t.closest && t.closest("[data-svc]");
    if (row && t.dataset.f) {
      var patch = {}; patch[t.dataset.f] = t.dataset.f === "active" ? t.checked : (t.dataset.f === "crews" ? +t.value : t.value);
      SB.update("move_types", "id=eq." + row.dataset.svc, patch).then(function () { SB.toast("Serviço atualizado."); S.tmap[row.dataset.svc] && Object.assign(S.tmap[row.dataset.svc], patch); }).catch(err);
    }
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target, d;
    if (f.id === "crewNew") {
      ev.preventDefault(); d = new FormData(f);
      SB.insert("crews", { name: String(d.get("n")).trim(), truck: String(d.get("t") || "").trim(), sort: S.crews.length + 1 }).then(function () { SB.toast("Equipe adicionada."); vEquipes(); }).catch(err);
    } else if (f.dataset && f.dataset.offForm) {
      ev.preventDefault(); d = new FormData(f);
      var a = d.get("a"), b = d.get("b"); if (b < a) { SB.toast("A data final precisa ser depois da inicial.", true); return; }
      SB.insert("crew_off", { crew_id: +f.dataset.offForm, date_from: a, date_to: b, reason: String(d.get("r") || "").trim() }).then(function () { SB.toast("Indisponibilidade marcada."); vEquipes(); }).catch(err);
    } else if (f.id === "blkNew") {
      ev.preventDefault(); d = new FormData(f);
      var s = d.get("a"), e = d.get("b") || s, rows = []; if (e < s) { SB.toast("A data final precisa ser depois da inicial.", true); return; }
      for (var x = s, n = 0; x <= e && n < 120; x = SB.addDays(x, 1), n++) rows.push({ day: x, reason: String(d.get("r") || "").trim() });
      SB.req("/rest/v1/blocked_dates?on_conflict=day", { method: "POST", body: rows, headers: { Prefer: "resolution=merge-duplicates,return=minimal" } }).then(function () { SB.toast("Data(s) fechada(s)."); vBloqueios(); }).catch(err);
    } else if (f.id === "setF") {
      ev.preventDefault();
      var fe = f.elements, wd = $$('input[name="wd"]:checked', f).map(function (c) { return +c.value; });
      if (!wd.length) { var er = $("#sErr"); er.textContent = "Escolha pelo menos um dia de atendimento."; er.hidden = false; return; }
      $("#sErr").hidden = true;
      var patch = { business_name: fe.business_name.value.trim(), whatsapp: digits(fe.whatsapp.value), phone: fe.phone.value.trim(), email: fe.email.value.trim(), work_days: wd, morning_label: fe.morning_label.value.trim(), afternoon_label: fe.afternoon_label.value.trim(), booking_window_days: +fe.booking_window_days.value || 90, min_notice_days: Math.max(0, +fe.min_notice_days.value || 0), max_active_per_phone: +fe.max_active_per_phone.value || 3, auto_confirm: fe.auto_confirm.checked };
      SB.update("settings", "id=eq.1", patch).then(function (r) { S.set = r[0] || S.set; SB.toast("Ajustes salvos."); }).catch(err);
    }
  });

  /* ---------- boot ---------- */
  buildNav();
  setMode("in");
  if (SB.session) start().catch(function () { SB.signOut().then(showLogin); });
  else showLogin();
})();
</script>
</body>
</html>
